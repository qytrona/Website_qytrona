<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../service-art/base.css"><link rel="stylesheet" href="blog.css">
<style>
  .product { left: 100px; top: 80px; width: 470px; padding: 24px; }
  .pimg { height: 300px; border-radius: 22px; background: linear-gradient(140deg, #fde4d6, #ffd2bf); display: flex; align-items: center; justify-content: center; }
  .checkout { left: 640px; top: 110px; width: 520px; padding: 32px; }
  .pay { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  .pay span { padding: 12px 18px; border-radius: 14px; border: 2px solid var(--line); font-size: 20px; font-weight: 500; }
  .pay span.on { border-color: var(--orange); color: var(--orange); background: var(--peach); }
  .cartbadge { left: 520px; top: 50px; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; }
</style></head>
<body data-fit-w="1120" data-fit-h="600">
  <div class="dots"></div>
  <div class="glow o" style="width:560px;height:560px;right:140px;top:0"></div>

  <div class="card product">
    <div class="pimg"><svg width="140" height="140" viewBox="0 0 24 24" fill="none" stroke="#ff5f2d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></div>
    <div class="big" style="font-size:28px;margin-top:18px">Everyday Tote</div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:6px;font-size:20px"><span style="color:#f5a623">★★★★★</span><span class="label">Free delivery</span></div>
    <div style="margin-top:16px;height:58px;border-radius:16px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500">Add to cart</div>
  </div>

  <div class="card checkout">
    <div class="big" style="font-size:32px">Checkout</div>
    <div class="label" style="margin-top:4px">Guest checkout · 2 steps</div>
    <div class="bar" style="width:100%;height:48px;border-radius:14px;margin-top:20px;background:#faf7f5;border:1px solid var(--line)"></div>
    <div class="bar" style="width:100%;height:48px;border-radius:14px;margin-top:12px;background:#faf7f5;border:1px solid var(--line)"></div>
    <div class="pay"><span class="on">UPI</span><span>Card</span><span>Net banking</span><span>COD</span></div>
    <div style="margin-top:20px;height:58px;border-radius:16px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500">Place order</div>
  </div>

  <div class="card dark cartbadge" style="border-radius:50%">
    <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#ff5f2d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/></svg>
  </div>
  <script src="../service-art/fit.js"></script>
</body></html>
