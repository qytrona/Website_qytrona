<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../service-art/base.css"><link rel="stylesheet" href="blog.css">
<style>
  .post { left: 100px; top: 60px; width: 420px; padding: 22px; }
  .media { margin-top: 18px; height: 360px; border-radius: 20px; background: linear-gradient(150deg, #0c0705 0%, #3a1a10 55%, var(--orange) 140%); position: relative; overflow: hidden; }
  .search { left: 720px; top: 150px; width: 520px; padding: 30px 32px; }
  .sbox { height: 64px; border-radius: 99px; border: 2px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 22px; font-size: 22px; }
</style></head>
<body data-fit-w="1120" data-fit-h="600">
  <div class="dots"></div>
  <div class="glow o" style="width:560px;height:560px;left:80px;top:-80px"></div>
  <div class="glow o" style="width:460px;height:460px;right:80px;bottom:-40px;opacity:.7"></div>

  <div class="card post">
    <div style="display:flex;align-items:center;gap:12px"><div style="width:46px;height:46px;border-radius:50%;background:var(--orange)"></div><div><div class="big" style="font-size:20px">Your Brand</div><div class="label" style="font-size:15px">Sponsored</div></div></div>
    <div class="media"><div style="position:absolute;left:24px;bottom:24px;color:#fff;font-size:42px;line-height:1" class="big">New in<br>store</div><div style="position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;border:34px solid rgba(255,95,45,.55)"></div></div>
    <div style="display:flex;gap:20px;margin-top:14px;font-size:18px;color:var(--muted)"><span>♥ Like</span><span>↗ Share</span></div>
  </div>

  <div class="card search">
    <div class="sbox"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9a918c" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>ac repair near me</div>
    <div style="margin-top:22px;padding:20px;border-radius:18px;background:var(--peach);border:2px solid rgba(255,95,45,.3)">
      <div style="display:flex;gap:10px;align-items:center"><span class="chip" style="background:var(--dark);color:#fff;font-size:15px;padding:4px 12px">Sponsored</span><span style="color:#1a8f3a;font-size:17px">yourbusiness.com</span></div>
      <div class="big" style="font-size:26px;color:var(--orange);margin-top:10px">Same-day AC Repair — Call Now</div>
      <div class="bar" style="width:90%;margin-top:12px"></div>
    </div>
    <div class="bar" style="width:40%;margin-top:22px;height:12px"></div><div class="bar" style="width:75%;margin-top:12px"></div>
  </div>

  <div class="vs" style="left:560px;top:280px">VS</div>
  <script src="../service-art/fit.js"></script>
</body></html>
