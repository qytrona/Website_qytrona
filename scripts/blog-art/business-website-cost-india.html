<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../service-art/base.css"><link rel="stylesheet" href="blog.css">
<style>
  .quote { left: 100px; top: 90px; width: 600px; padding: 40px 44px; }
  .line { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px dashed var(--line); font-size: 24px; }
  .tag { left: 760px; top: 160px; width: 420px; height: 300px; display: flex; flex-direction: column; justify-content: center; align-items: center; transform: rotate(6deg); }
  .hole { position: absolute; left: 34px; top: 50%; width: 30px; height: 30px; border-radius: 50%; background: var(--peach); transform: translateY(-50%); }
</style></head>
<body data-fit-w="1120" data-fit-h="600">
  <div class="dots"></div>
  <div class="glow o" style="width:560px;height:560px;right:120px;top:40px"></div>

  <div class="card quote">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="big" style="font-size:36px">Website quote</div>
      <div class="chip" style="background:#e8f8ec;color:#1a8f3a;font-size:18px">Fixed price</div>
    </div>
    <div style="margin-top:18px">
      <div class="line"><span>Pages &amp; design</span><span class="bar" style="width:110px"></span></div>
      <div class="line"><span>Features &amp; forms</span><span class="bar" style="width:90px"></span></div>
      <div class="line"><span>Content &amp; SEO setup</span><span class="bar" style="width:120px"></span></div>
      <div class="line"><span>Domain &amp; hosting</span><span class="bar" style="width:70px"></span></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px">
      <span class="big" style="font-size:28px">Total</span>
      <span class="bar o" style="width:160px;height:22px"></span>
    </div>
  </div>

  <div class="card dark tag">
    <div class="hole"></div>
    <div style="font-size:150px;line-height:1;font-weight:600;color:var(--orange)">₹</div>
    <div style="font-size:30px;font-weight:500;margin-top:10px">What it really costs</div>
  </div>
  <script src="../service-art/fit.js"></script>
</body></html>
