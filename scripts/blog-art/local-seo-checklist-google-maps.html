<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../service-art/base.css"><link rel="stylesheet" href="blog.css">
<style>
  .map { left: 100px; top: 100px; width: 640px; height: 500px; overflow: hidden;
    background: #eef3ee;
    background-image: linear-gradient(90deg, transparent 47%, #fff 47%, #fff 53%, transparent 53%), linear-gradient(0deg, transparent 47%, #fff 47%, #fff 53%, transparent 53%), linear-gradient(35deg, transparent 48%, #fff 48%, #fff 51%, transparent 51%);
    background-size: 220px 220px, 260px 260px, 100% 100%; }
  .pin { position: absolute; left: 380px; top: 150px; }
  .listing { left: 160px; top: 430px; width: 520px; padding: 22px 26px; }
  .check { left: 800px; top: 120px; width: 420px; padding: 34px 34px; display: flex; flex-direction: column; gap: 20px; }
</style></head>
<body data-fit-w="1120" data-fit-h="600">
  <div class="dots"></div>
  <div class="glow o" style="width:560px;height:560px;left:200px;top:-60px"></div>

  <div class="card map">
    <svg class="pin" width="120" height="160" viewBox="0 0 24 32"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0Z" fill="#ff5f2d"/><circle cx="12" cy="12" r="5" fill="#fff"/></svg>
    <div style="position:absolute;left:150px;top:300px;width:22px;height:22px;border-radius:50%;background:#9a918c;opacity:.5"></div>
    <div style="position:absolute;left:520px;top:110px;width:22px;height:22px;border-radius:50%;background:#9a918c;opacity:.5"></div>
  </div>

  <div class="card listing">
    <div class="big" style="font-size:28px">Your Business</div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:6px;font-size:22px"><span style="color:#f5a623">★★★★★</span><span class="label">Open now · Near you</span></div>
    <div style="display:flex;gap:10px;margin-top:14px"><div class="chip" style="background:var(--orange);color:#fff;font-size:18px">Directions</div><div class="chip" style="border:2px solid var(--line);font-size:18px">Call</div></div>
  </div>

  <div class="card check">
    <div class="big" style="font-size:32px">Local SEO checklist</div>
    <div class="row"><span class="tick" style="background:#e8f8ec;color:#1a8f3a">✓</span>Business profile</div>
    <div class="row"><span class="tick" style="background:#e8f8ec;color:#1a8f3a">✓</span>Same name &amp; number</div>
    <div class="row"><span class="tick" style="background:#e8f8ec;color:#1a8f3a">✓</span>Fresh reviews</div>
    <div class="row"><span class="tick" style="background:rgba(255,95,45,.15);color:var(--orange)">•</span>Location pages</div>
    <div class="row"><span class="tick" style="background:#f3ece8;color:var(--muted)">○</span>Fast mobile site</div>
  </div>
  <script src="../service-art/fit.js"></script>
</body></html>
