<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../service-art/base.css"><link rel="stylesheet" href="blog.css">
<style>
  .web { left: 100px; top: 120px; width: 640px; height: 460px; overflow: hidden; }
  .bar2 { height: 50px; background: #f6f2ef; display: flex; align-items: center; gap: 10px; padding: 0 22px; }
  .bar2 i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .phone { position: absolute; left: 880px; top: 70px; width: 290px; height: 580px; border-radius: 48px; background: var(--dark); padding: 12px; box-shadow: 0 50px 90px -30px rgba(12,7,5,.55); }
  .screen { width: 100%; height: 100%; border-radius: 38px; background: #fff; overflow: hidden; padding: 56px 20px 20px; }
</style></head>
<body data-fit-w="1120" data-fit-h="600">
  <div class="dots"></div>
  <div class="glow o" style="width:600px;height:600px;left:500px;top:100px"></div>

  <div class="card web">
    <div class="bar2"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div style="padding:36px 40px">
      <div class="label">Website</div>
      <div class="big" style="font-size:46px;margin-top:6px">Get found on Google</div>
      <div class="bar" style="width:85%;margin-top:22px"></div><div class="bar" style="width:65%;margin-top:12px"></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px">
        <div style="height:120px;border-radius:16px;background:#fde4d6"></div><div style="height:120px;border-radius:16px;background:var(--orange)"></div><div style="height:120px;border-radius:16px;background:#fde4d6"></div>
      </div>
    </div>
  </div>

  <div class="phone"><div class="screen">
    <div class="label" style="font-size:16px">Mobile app</div>
    <div class="big" style="font-size:28px;margin-top:4px">Keep them coming back</div>
    <div style="height:150px;border-radius:22px;background:linear-gradient(140deg,var(--orange),#c73f18);margin-top:18px"></div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:18px">
      <div style="height:54px;border-radius:14px;background:#faf3ef"></div><div style="height:54px;border-radius:14px;background:#faf3ef"></div><div style="height:54px;border-radius:14px;background:#fde4d6"></div>
    </div>
  </div></div>

  <div class="vs" style="left:760px;top:300px">VS</div>
  <script src="../service-art/fit.js"></script>
</body></html>
